- id: T11.1
  parent: T11
  name: 定义可运行知识图谱契约与Neo4j映射
  status: done
  progress_state: accepted
  review_required: true
  depends_on: [T09.1]
  core_principles:
    - 单一事实源与确定性映射：T09 V1.1本体是缺陷、原因、工序、指标和Tool关系的唯一权威来源，导入必须幂等、可校验且不得由LLM临时发明实体或关系
    - 面向决策而非展示：图谱查询必须返回可供Agent直接消费的因果候选路径、关系强度、验证状态、所需输入和下一验证动作，接口保持框架无关
    - 证据可追溯且不确定性显式化：每条候选关系必须保留来源与解释，不把候选原因冒充唯一根因，无Tool或证据不足的关系继续以unverified返回，优化后必须要求重新预测验证
  deliverables:
    - 节点、关系、唯一约束和索引定义
    - 因果候选与下一验证动作查询返回Schema
    - 本体字段到Neo4j属性的确定性映射
    - SPI Tool、无Tool人工检查及shifted_component双路径示例
    - 本体、映射、Schema、示例和Tool名称一致性测试
  acceptance:
    - 使用CausalHypothesis表达候选致因，不创建确定性的CAUSED_BY关系
    - 四类缺陷和五条权威路径完整映射，shifted_component同时返回两条候选路径
    - tool_supported只表示具备验证能力，运行初始状态固定为not_evaluated
    - required_controls支持一个缺陷汇总多个工序指标，但不新增T09之外的事实
    - 无Tool关系保留为unverified并返回manual_inspection
    - 不连接Neo4j、不自动关联RAG Chunk、不启用待确认阈值
    - 13项T11.1契约测试及T09本体回归测试通过

